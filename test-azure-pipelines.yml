trigger:
  branches:
    include:
    - development
variables:
- name: projectFolder
  value: '$(System.DefaultWorkingDirectory)'
- name: buildOutputFolder
  value: '.output/public'
stages:
- stage: __default
  jobs:
  - job: Job
    pool:
      vmImage: ubuntu-latest
    strategy:
      matrix:
        node_20_x:
          node_version: 20.x
    steps:
    - task: UseNode@1
      inputs:
        version: '20.x'
    - task: CmdLine@2
      inputs:
        script: |
          pushd $(projectFolder) && npm install && popd
          pushd $(projectFolder) && npm run generate
          pushd $(projectFolder) && npm run coverage
    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(projectFolder)/coverage/clover.xml'
        reportDirectory: '$(projectFolder)/coverage'
    - task: SonarCloudPrepare@2
      inputs:
        SonarCloud: 'Sonar Cloud'
        organization: 'mattadevopsteam'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'mattadevopsteam_matta-frontend'
        cliProjectName: 'matta.frontend'
        cliSources: '.'
        extraProperties: |
          sonar.javascript.lcov.reportPaths=$(Agent.BuildDirectory)/coverage/lcov.info
    - task: CopyFiles@2
      inputs:
        sourceFolder: '$(buildOutputFolder)'
        contents: '*/'
        targetFolder: '$(Build.ArtifactStagingDirectory)'
        cleanTargetFolder: true
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: $(Build.ArtifactStagingDirectory)
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        includeRootFolder: false
    - task: PublishBuildArtifacts@1
      inputs:
        pathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    - task: SonarCloudAnalyze@2
      displayName: 'Run SonarCloud analysis'
    - task: SonarCloudPublish@2
      displayName: 'Publish results on build summary'
      inputs:
        pollingTimeoutSec: '300'

