trigger:
  branches:
    include:
    - production
variables:
- name: projectFolder
  value: '$(System.DefaultWorkingDirectory)'
- name: buildOutputFolder
  value: '.output/public'
stages:
- stage: __default
  jobs:
  - job: Job
    pool:
      vmImage: ubuntu-latest
    strategy:
      matrix:
        node_20_x:
          node_version: 20.x
    steps:
    - task: CopyFiles@2
      inputs:
        SourceFolder: 'production'
        Contents: '**'
        TargetFolder: '$(Build.Repository.LocalPath)'
        OverWrite: true

    - task: UseNode@1
      inputs:
        version: '20.x'
    - task: CmdLine@2
      inputs:
        script: |
          pushd $(projectFolder) && npm install && popd
          pushd $(projectFolder) && npm run build && popd
          pushd $(projectFolder) && npm run generate
    - task: CopyFiles@2
      inputs:
        sourceFolder: '$(buildOutputFolder)'
        contents: '**/*'
        targetFolder: '$(Build.ArtifactStagingDirectory)'
        cleanTargetFolder: true
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: $(Build.ArtifactStagingDirectory)
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        includeRootFolder: false
    - task: PublishBuildArtifacts@1
      inputs:
        pathtoPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'

